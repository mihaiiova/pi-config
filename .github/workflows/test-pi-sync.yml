name: Test Pi sync

on:
  pull_request:
    paths:
      - .github/workflows/test-pi-sync.yml
      - extensions/pi-sync/**
      - tests/pi-sync/**
      - AGENTS.md
      - README.md
  push:
    branches: [master]
    paths:
      - .github/workflows/test-pi-sync.yml
      - extensions/pi-sync/**
      - tests/pi-sync/**
      - AGENTS.md
      - README.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Pi sync repository path
        run: tests/pi-sync/test.sh
