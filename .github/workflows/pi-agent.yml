name: Pi agent

on:
  workflow_call:
    inputs:
      runner:
        description: Self-hosted runner label.
        required: false
        type: string
        default: pi-agent
      pi_command:
        description: Pi executable installed on the runner.
        required: false
        type: string
        default: pi
      ready_label:
        description: Existing label for implementation-ready work; empty disables it.
        required: false
        type: string
        default: ready-for-agent
      defining_label:
        description: Label used while a definition interview is active.
        required: false
        type: string
        default: agent:defining
      branch_prefix:
        description: Branch prefix used by implement.
        required: false
        type: string
        default: pi/issue-
      verification_command:
        description: Project-level command implement must run before publishing.
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: Maximum duration of one Pi run.
        required: false
        type: number
        default: 60

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pi-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'issue_comment' && github.event.action == 'created'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      PI_COMMAND: ${{ inputs.pi_command }}
      PI_EVENT_PATH: ${{ github.event_path }}
      PI_REPOSITORY: ${{ github.repository }}
      PI_ISSUE_NUMBER: ${{ github.event.issue.number }}
      PI_COMMENT_ID: ${{ github.event.comment.id }}
      PI_READY_LABEL: ${{ inputs.ready_label }}
      PI_DEFINING_LABEL: ${{ inputs.defining_label }}
      PI_BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      PI_VERIFICATION_COMMAND: ${{ inputs.verification_command }}

    steps:
      - name: Authorize command
        id: command
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if jq -e '.issue.pull_request != null' "$PI_EVENT_PATH" >/dev/null; then
            echo "Pi issue commands do not run from pull request comments." >&2
            exit 1
          fi

          body="$(jq -r '.comment.body // ""' "$PI_EVENT_PATH")"
          command=""
          shopt -s nocasematch
          if [[ "$body" =~ (^|[[:space:]])@pi[[:space:]]+(define-spec|create-spec|implement)([[:space:]]|$) ]]; then
            command="$(printf '%s' "${BASH_REMATCH[2]}" | tr '[:upper:]' '[:lower:]')"
          elif jq -e --arg label "$PI_DEFINING_LABEL" \
            'any(.issue.labels[]?; .name == $label)' "$PI_EVENT_PATH" >/dev/null; then
            command="define-spec"
          else
            echo "No supported @pi command or active definition interview found." >&2
            exit 1
          fi

          actor="$(jq -r '.comment.user.login' "$PI_EVENT_PATH")"
          permission="$(gh api "repos/$PI_REPOSITORY/collaborators/$actor/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "$actor does not have write access to $PI_REPOSITORY." >&2
              exit 1
              ;;
          esac

          printf 'name=%s\n' "$command" >> "$GITHUB_OUTPUT"

      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Pi orchestration
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pi-agent/pi-config
          persist-credentials: false

      - name: Keep orchestration out of project changes
        shell: bash
        run: echo '/.pi-agent/' >> .git/info/exclude

      - name: Fetch issue context
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PI_CONFIG_DIR: ${{ github.workspace }}/.pi-agent/pi-config
          PI_WORK_DIR: ${{ runner.temp }}/pi-agent-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$PI_WORK_DIR"
          "$PI_CONFIG_DIR/scripts/pi-github/fetch-thread.sh" "$PI_WORK_DIR/issue-thread.md"

      - name: Run planning Pi without GitHub credentials
        id: pi_planning
        if: steps.fetch.outcome == 'success' && steps.command.outputs.name != 'implement'
        continue-on-error: true
        shell: bash
        env:
          PI_AGENT_COMMAND: ${{ steps.command.outputs.name }}
          PI_CONFIG_DIR: ${{ github.workspace }}/.pi-agent/pi-config
          PI_WORK_DIR: ${{ runner.temp }}/pi-agent-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            LANG="${LANG:-C.UTF-8}" \
            CI=true \
            PI_COMMAND="$PI_COMMAND" \
            PI_AGENT_COMMAND="$PI_AGENT_COMMAND" \
            PI_CONFIG_DIR="$PI_CONFIG_DIR" \
            PI_WORK_DIR="$PI_WORK_DIR" \
            PI_REPOSITORY="$PI_REPOSITORY" \
            PI_ISSUE_NUMBER="$PI_ISSUE_NUMBER" \
            PI_READY_LABEL="$PI_READY_LABEL" \
            PI_DEFINING_LABEL="$PI_DEFINING_LABEL" \
            PI_BRANCH_PREFIX="$PI_BRANCH_PREFIX" \
            PI_VERIFICATION_COMMAND="$PI_VERIFICATION_COMMAND" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GH_CONFIG_DIR="$PI_WORK_DIR/gh-config" \
            "$PI_CONFIG_DIR/scripts/pi-github/run.sh"

      - name: Run implementation Pi with ephemeral GitHub credentials
        id: pi_implement
        if: steps.fetch.outcome == 'success' && steps.command.outputs.name == 'implement'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_CONFIG_DIR: ${{ runner.temp }}/pi-agent-${{ github.run_id }}-${{ github.run_attempt }}/gh-config
          PI_AGENT_COMMAND: implement
          PI_CONFIG_DIR: ${{ github.workspace }}/.pi-agent/pi-config
          PI_WORK_DIR: ${{ runner.temp }}/pi-agent-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header"
          export GIT_TERMINAL_PROMPT=0
          "$PI_CONFIG_DIR/scripts/pi-github/run.sh"

      - name: Apply Pi result
        id: apply
        if: >-
          always() &&
          ((steps.command.outputs.name == 'implement' && steps.pi_implement.outcome == 'success') ||
          (steps.command.outputs.name != 'implement' && steps.pi_planning.outcome == 'success'))
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PI_AGENT_COMMAND: ${{ steps.command.outputs.name }}
          PI_CONFIG_DIR: ${{ github.workspace }}/.pi-agent/pi-config
          PI_WORK_DIR: ${{ runner.temp }}/pi-agent-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$PI_AGENT_COMMAND" in
            create-spec)
              "$PI_CONFIG_DIR/scripts/pi-github/apply-spec-plan.sh" \
                "$PI_WORK_DIR/spec-plan.json" "$PI_WORK_DIR/result.md"
              ;;
            define-spec)
              "$PI_CONFIG_DIR/scripts/pi-github/apply-definition.sh" "$PI_WORK_DIR/result.md"
              ;;
            implement)
              "$PI_CONFIG_DIR/scripts/pi-github/comment.sh" "$PI_WORK_DIR/result.md"
              ;;
          esac

      - name: Report failure
        if: >-
          always() &&
          (steps.fetch.outcome == 'failure' ||
          steps.pi_planning.outcome == 'failure' ||
          steps.pi_implement.outcome == 'failure' ||
          steps.apply.outcome == 'failure')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PI_CONFIG_DIR: ${{ github.workspace }}/.pi-agent/pi-config
        run: |
          "$PI_CONFIG_DIR/scripts/pi-github/comment.sh" \
            "Pi could not complete \`@pi ${{ steps.command.outputs.name }}\`. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for details."
          exit 1

      - name: Remove ephemeral Pi data
        if: always()
        shell: bash
        env:
          PI_CONFIG_DIR: ${{ github.workspace }}/.pi-agent/pi-config
          PI_WORK_DIR: ${{ runner.temp }}/pi-agent-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          expected_work_dir="$RUNNER_TEMP/pi-agent-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$PI_WORK_DIR" != "$expected_work_dir" ]]; then
            echo "Refusing to clean unexpected work directory: $PI_WORK_DIR" >&2
            exit 1
          fi

          expected_config_dir="$GITHUB_WORKSPACE/.pi-agent/pi-config"
          if [[ "$PI_CONFIG_DIR" != "$expected_config_dir" ]]; then
            echo "Refusing to clean unexpected config directory: $PI_CONFIG_DIR" >&2
            exit 1
          fi

          rm -rf -- "$PI_WORK_DIR"
          rm -rf -- "$PI_CONFIG_DIR"
          rmdir "$GITHUB_WORKSPACE/.pi-agent" 2>/dev/null || true
