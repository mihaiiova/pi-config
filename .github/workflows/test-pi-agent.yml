name: Test Pi agent

on:
  pull_request:
    paths:
      - .github/workflows/pi-agent.yml
      - .github/workflows/test-pi-agent.yml
      - scripts/pi-github/**
      - skills/define-spec/**
      - skills/create-spec/**
      - skills/implement/**
      - tests/pi-github/**
  push:
    branches: [master]
    paths:
      - .github/workflows/pi-agent.yml
      - .github/workflows/test-pi-agent.yml
      - scripts/pi-github/**
      - skills/define-spec/**
      - skills/create-spec/**
      - skills/implement/**
      - tests/pi-github/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Pi agent v1 tests
        run: tests/pi-github/test.sh
